name: Refresh NBA league data
on:
  push:
    branches: [main]
    paths:
      - league_feed.py
      - scripts/refresh_league_feed.py
      - .github/workflows/live-board-feed.yml
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-league-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Refresh verified league data
        run: python scripts/refresh_league_feed.py
      - name: Save updated data
        shell: bash
        run: |
          git config user.name 'nba-data-feed[bot]'
          git config user.email 'nba-data-feed@users.noreply.github.com'
          git add data/league-feed.json.gz data/league-boxscores.json.gz 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh league-wide NBA stats and five-position data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
