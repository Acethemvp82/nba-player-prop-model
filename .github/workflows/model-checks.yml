name: NBA Model Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_espn_probe:
        description: 'Run ESPN completed-game network smoke test'
        type: boolean
        default: false
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m compileall -q -x '(^|/)(\.git|\.venv|venv)/' .
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run automated tests
        run: python -m pytest -q
      - name: Validate module imports
        run: python -c "import baseline_backtest, csv_export, espn_board_quality, espn_history_health, espn_averages, espn_final_stats, espn_history, espn_history_coverage, espn_players, espn_schedule, espn_trends, historical_stats, history_collection, history_quality, nba_data, opponent_stats, player_stats, pregame_roster, projection_baseline, roster_coverage, season_schedule"
      - name: Live ESPN completed-game probe (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_espn_probe }}
        run: python scripts/espn_live_probe.py
