name: Save and score pregame forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '11 14,19,22 * * *'
permissions:
  contents: write
concurrency:
  group: forecast-history
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/track_regular_forecasts.py
      - name: Persist first forecasts and results
        run: |
          git config user.name 'nba-model-tracker[bot]'
          git config user.email 'nba-model-tracker@users.noreply.github.com'
          git add data/forecasts data/forecast-results.json 2>/dev/null || git add data/forecast-results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record pregame references and verified results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
